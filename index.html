<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>September 2024 — inskrywing</title>
<meta name="theme-color" content="#fffdf8">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="wrap">

  <!-- ---------------------------------------------------------- name gate -->
  <section id="gate">
    <div class="top"><h1 id="gateHead">September 2024</h1></div>
    <div class="card">
      <form id="gateForm">
        <label class="fld" for="nameInput" id="gateTitle">Wat is jou naam?</label>
        <input type="text" id="nameInput" autocomplete="name" autocapitalize="words"
               maxlength="60" required>
        <p class="small muted" style="margin:8px 0 14px" id="gateHint">
          Naam en van, sodat ek weet wie s&#325; een is.
        </p>
        <button class="btn" type="submit" id="gateBtn">Begin</button>
      </form>
    </div>
  </section>

  <!-- ------------------------------------------------------------- main -->
  <main id="main" class="hide">
    <div class="top">
      <h1 id="h1">September 2024</h1>
      <button class="chip" id="langbtn" type="button">English</button>
      <p class="sub" id="hsub"></p>
    </div>

    <div class="card" style="padding:12px 14px">
      <div class="small muted" style="display:flex; justify-content:space-between; gap:10px">
        <span id="whoami"></span>
        <button class="chip" id="notyou" type="button" style="padding:2px 10px; font-size:.76rem">Nie jy nie?</button>
      </div>
      <div class="bar" id="bar" style="margin-top:10px"></div>
      <div class="progline">
        <span id="progtext"></span>
        <span id="progdone" style="font-weight:700; color:var(--s3)"></span>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" data-i="0" role="tab" aria-selected="true">Vraestel 1</button>
      <button type="button" data-i="1" role="tab" aria-selected="false">Vraestel 2</button>
    </div>

    <div id="questions"></div>

    <div class="card">
      <label class="fld" for="note" id="noteLabel">Enigiets anders wat jou verwar het?</label>
      <textarea id="note" maxlength="1000"></textarea>
      <p class="small muted" style="margin-top:6px" id="noteHint">Opsioneel.</p>
    </div>
  </main>
</div>

<div class="sync gone" id="sync"></div>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
